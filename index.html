<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hi, I'm Rowena!</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; background: #fff; min-height: 100vh; overflow: hidden; cursor: none; }
.cursor { width: 10px; height: 10px; background: #ff2d9b; border-radius: 50%; position: fixed; pointer-events: none; z-index: 9999; transform: translate(-50%, -50%); transition: width 0.2s, height 0.2s, background 0.2s; mix-blend-mode: multiply; }
.cursor.hovering { width: 32px; height: 32px; background: #ff2d9b44; border: 2px solid #ff2d9b; }
.page { width: 100vw; height: 100vh; display: grid; grid-template-columns: 58% 42%; position: relative; z-index: 1; }
.hand-area { position: relative; display: flex; align-items: flex-end; justify-content: center; overflow: visible; }
.hand-img { position: absolute; bottom: 0; left: -20px; width: 95%; height: 90%; object-fit: contain; object-position: bottom left; }
.icons-layer { position: absolute; inset: 0; pointer-events: none; }
.icon-item { position: absolute; pointer-events: all; cursor: none; display: flex; flex-direction: column; align-items: center; gap: 0; transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1); z-index: 10; }
.icon-item:hover { transform: translateY(-22px) scale(1.08); z-index: 20; }
.icon-img { width: var(--size, 90px); height: var(--size, 90px); object-fit: contain; filter: drop-shadow(0 8px 16px rgba(0,0,0,0.12)); transition: filter 0.3s; }
.icon-item:hover .icon-img { filter: drop-shadow(0 16px 28px rgba(255,45,155,0.25)); }
.icon-emoji { width: var(--size, 90px); height: var(--size, 90px); display: flex; align-items: center; justify-content: center; font-size: var(--emoji-size, 60px); filter: drop-shadow(0 8px 16px rgba(0,0,0,0.12)); transition: filter 0.3s; }
.icon-item:hover .icon-emoji { filter: drop-shadow(0 16px 28px rgba(255,45,155,0.25)); }
.icon-label { font-family: 'VT323', monospace; font-size: 17px; color: #ff2d9b; background: white; border: 1.5px solid #ff2d9b; border-radius: 999px; padding: 3px 14px; white-space: nowrap; opacity: 0; transform: translateY(6px); transition: opacity 0.25s ease, transform 0.25s ease; margin-top: 8px; pointer-events: none; letter-spacing: 0.5px; }
.icon-item:hover .icon-label { opacity: 1; transform: translateY(0); }
.ic-insync { --size: 100px; left: 28%; bottom: 34%; }
.ic-purple { --size: 80px; --emoji-size: 58px; left: 22%; bottom: 56%; }
.ic-moon   { --size: 78px;  left: 43%; bottom: 60%; }
.ic-after  { --size: 88px;  left: 46%; bottom: 44%; }
.ic-apple  { --size: 58px;  left: 46%; bottom: 28%; }
.right-panel { display: flex; flex-direction: column; justify-content: center; padding: 0 48px 80px 20px; position: relative; }
.greeting { font-family: 'VT323', monospace; font-size: clamp(42px, 5.5vw, 72px); color: #ff2d9b; line-height: 1.1; margin-bottom: 28px; letter-spacing: 1px; }
.sub { font-size: 15px; color: #888; line-height: 1.7; max-width: 280px; margin-bottom: 40px; }
.nav-links { display: flex; flex-direction: column; gap: 6px; margin-bottom: 48px; }
.nav-link { font-family: 'VT323', monospace; font-size: 20px; color: #222; text-decoration: none; letter-spacing: 1px; display: flex; align-items: center; gap: 10px; transition: color 0.2s, gap 0.2s; cursor: none; }
.nav-link:hover { color: #ff2d9b; gap: 16px; }
.nav-link::before { content: '>'; color: #ff2d9b; opacity: 0; transition: opacity 0.2s; }
.nav-link:hover::before { opacity: 1; }
.contact { position: absolute; bottom: 32px; right: 48px; text-align: right; font-size: 12px; color: #999; line-height: 1.8; }
.contact a { color: #999; text-decoration: none; }
.contact a:hover { color: #ff2d9b; }
.hint { position: absolute; bottom: 24px; left: 32px; font-family: 'VT323', monospace; font-size: 15px; color: #ddd; letter-spacing: 1px; }
body::before { content: ''; position: fixed; inset: 0; background-image: radial-gradient(#f0f0f0 1px, transparent 1px); background-size: 28px 28px; pointer-events: none; z-index: 0; }
</style>
</head>
<body>

<div class="cursor" id="cursor"></div>

<div class="page">
  <div class="hand-area">
    <img class="hand-img" src="./hand.png" alt="hand" onerror="this.style.display='none'">

    <div class="icons-layer">

      <!-- 白色生物: Insync → 4.png -->
      <div class="icon-item ic-insync" onclick="goTo('insync.html')">
        <img class="icon-img" src="./4.png" alt="Insync">
        <div class="icon-label">Insync</div>
      </div>

      <!-- 紫色生物: Coming Soon → placeholder emoji -->
      <div class="icon-item ic-purple" onclick="goTo('#')">
        <div class="icon-emoji">🦇</div>
        <div class="icon-label">Coming Soon</div>
      </div>

      <!-- 土星: What the Moon Brings → 1.png -->
      <div class="icon-item ic-moon" onclick="goTo('moon.html')">
        <img class="icon-img" src="./1.png" alt="What the Moon Brings">
        <div class="icon-label">What the Moon Brings</div>
      </div>

      <!-- 粉色blob: Aftertaste → 2.png -->
      <div class="icon-item ic-after" onclick="goTo('aftertaste.html')">
        <img class="icon-img" src="./2.png" alt="Aftertaste">
        <div class="icon-label">Aftertaste</div>
      </div>

      <!-- 苹果: Everything about Apple → 3.png -->
      <div class="icon-item ic-apple" onclick="goTo('apple.html')">
        <img class="icon-img" src="./3.png" alt="Everything about Apple">
        <div class="icon-label">Everything about Apple</div>
      </div>

    </div>
  </div>

  <div class="right-panel">
    <div class="greeting">Hi, I'm Rowena!</div>
    <p class="sub">Designer & creative thinker.<br>Hover the little friends to explore my work ✨</p>

    <div class="nav-links">
      <a href="about.html" class="nav-link">About</a>
      <a href="work.html" class="nav-link">Work</a>
      <a href="resume.pdf" class="nav-link">Resume</a>
    </div>

    <div class="contact">
      Contact Me:<br>
      <a href="mailto:rowenach@usc.edu">rowenach@usc.edu</a><br>
      +1 626 662 9366
    </div>
  </div>

  <div class="hint">← hover the icons</div>
</div>

<script>
const cursor = document.getElementById('cursor');
document.addEventListener('mousemove', e => {
  cursor.style.left = e.clientX + 'px';
  cursor.style.top = e.clientY + 'px';
});
document.querySelectorAll('.icon-item, .nav-link, .contact a').forEach(el => {
  el.addEventListener('mouseenter', () => cursor.classList.add('hovering'));
  el.addEventListener('mouseleave', () => cursor.classList.remove('hovering'));
});
function goTo(url) {
  window.location.href = url;
}
</script>
</body>
</html>
